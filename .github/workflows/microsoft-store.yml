name: Microsoft Store Freebies

on:
  workflow_dispatch:

  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: microsoft-store-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Microsoft Store notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node mstore.freebies.js

      - name: Save posted games
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posted.json

          if git diff --cached --quiet; then
            echo "No posted.json changes."
          else
            git commit -m "Update posted Microsoft Store freebies"
            git push
          fi
